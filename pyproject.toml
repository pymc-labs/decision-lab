[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dlab-cli"
version = "0.4.0"
description = "A harness for agentic data science — run coding agents with domain skills, parallel subagents, and frozen Docker environments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "DecisionAI"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "textual>=2.0",
    "modal>=0.70",
    "dhub-cli>=0.10",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "typer>=0.25",
]

# Single source of dev dependencies (issue #63). Installed with
# `pip install -e ".[dev]"`.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "matplotlib>=3.8",
]

[project.scripts]
dlab = "dlab.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dlab*"]

[tool.setuptools.package-data]
"dlab.data" = ["*.json"]
"dlab.data.figure_style" = ["matplotlibrc", "*.md"]
"dlab.js" = ["*.ts"]
"dlab.viewer.html" = ["*.html"]
